name: Email library

on:
  pull_request:
    paths: ["templates/**", ".claude/skills/shopify-email-html/**"]
  push:
    branches: [main]
    paths: ["templates/**", ".claude/skills/shopify-email-html/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sections, recipes and generated files are valid and current
        run: python3 .claude/skills/shopify-email-html/scripts/build_library.py --check
      - name: Install files pass the email linter
        run: |
          python3 .claude/skills/shopify-email-html/scripts/lint_email.py templates/emails/*/template.liquid.html --mode notification
          python3 .claude/skills/shopify-email-html/scripts/lint_email.py templates/emails/*/template.html --mode code-your-own
          python3 .claude/skills/shopify-email-html/scripts/lint_email.py templates/emails/*/custom-liquid/*.html --mode section
